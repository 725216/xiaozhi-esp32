name: Build Boards
on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main
  workflow_dispatch:  # 加上这一行！！开启手动触发按钮
permissions:
  contents: read
  
jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v
      - id: select
        name: Select variants based on changes
        shell: bash
        run: |
          # 固定编译两块板子，关闭文件变更自动筛选，name不再为空
          echo 'variants=[{"board":"bread-compact-esp32","name":"bread-compact-esp32","full_name":"bread-compact-esp32"},{"board":"bread-compact-esp32-coze","name":"bread-compact-esp32-coze","full_name":"bread-compact-esp32-coze"}]' >> "$GITHUB_OUTPUT"
  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
